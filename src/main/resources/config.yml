world:
  name: under_the_bedrock
  enabled-on-startup: true
  auto-start: true
  auto-join-on-connect: true
  auto-respawn: true
  lock-to-experience: true
  admin-stop-evacuation: true
  floor-y: 64
  spawn-x: 0
  spawn-z: 0
  time: 18000
  position-save-interval-ticks: 100
horror:
  null:
    minimum-distance-blocks: 1000
  director:
    enabled: true
    check-interval-seconds: 30
    minimum-occurrence-gap-seconds: 210
    severe-occurrence-cooldown-minutes: 12
    base-roll-chance: 0.07
    adaptive-pacing: true
    maximum-adaptive-bonus: 0.04
  events:
    enabled: true
    minimum-cooldown-seconds: 300
    maximum-cooldown-seconds: 420
    minimum-gap-from-occurrence-seconds: 90
    event-variation-memory: true
  exploration-pacing-v2: true
  exploration-pacing-v3: true
  clues:
    enabled: true
    scan-interval-ticks: 100
    site-cell-size-blocks: 1536
    minimum-distance-blocks: 768
    evidence-file: player-horror-memory.yml
  structures:
    enabled: true
    scan-interval-ticks: 100
    site-cell-size-blocks: 2048
    cell-generation-chance: 0.24
    minimum-distance-from-spawn-blocks: 600
    minimum-site-offset-blocks: 200
    maximum-site-offset-blocks: 340
    regeneration-hours: 1
    spawn-check-radius-blocks: 72
    ancient-factions-enabled: true
    memory-shard-chance: 1.0
    rare-artifact-chance: 0.04
    # Extra Upgrade Tokens are exceptionally rare outside the guaranteed lab cache.
    upgrade-token-chance: 0.005
  base:
    generator:
      capacity-hours: 96
      artifact-fuel-hours: 24
      vanilla-fuel-hours: 4
    ambient-disturbances: true
  supply-drops:
    enabled: true
    interval-minutes: 30
    retry-seconds: 60
    minimum-radius-blocks: 16
    maximum-radius-blocks: 40
    base-constructor-chance: 0.025
    # 0.1% chance per successfully populated airdrop crate.
    upgrade-token-chance: 0.001
  items:
    enabled: true
    cooldowns:
      emergency_rations: 45
      field_medkit: 45
      stabilizer_injection: 45
      sedative: 45
      speed_boost: 35
      emergency_barrier: 90
      null_ward: 90
      last_resort_device: 90
  entities:
    enabled: true
    safe-radius-blocks: 350
    full-threat-distance-blocks: 2800
    maximum-chance-per-check: 0.12
    successful-encounter-cooldown-minutes: 5
    active-encounters-per-player: 1
    max-encounter-duration-seconds: 180
    behavior:
      observation-range-blocks: 144
      despawn-range-blocks: 208
      passive-vanish-range-blocks: 60
      movement-tick-interval: 2
      encounter-check-interval-ticks: 60
      minimum-spawn-distance-blocks: 64
      maximum-spawn-distance-blocks: 112
      movement-step-blocks: 0.20
      remember-last-known-position: true
      player-specific-visibility: true
      adaptive-selection: true
    models:
      observer: watcher
      stalker: watcher
      wanderer: watcher
      mimic: watcher
      aggressor: watcher
      deep_entity: watcher
      witness: watcher
      peeker: watcher
      forgotten_resident: watcher
      surveyor: watcher
      lurker: watcher
      doorframe: watcher
      ceiling_crawler: watcher
      echo: watcher
      pursuer: watcher
      crawling_one: watcher
      heavy: watcher
      imitator: watcher
      misprint: watcher
      double: watcher
      absence: watcher
      excavator: watcher
      unperson: watcher
      original: watcher
  memory:
    file: player-horror-memory.yml
  civilization:
    enabled: true
    scan-interval-ticks: 120
    site-cell-size-blocks: 2048
    cell-generation-chance: 0.16
    minimum-distance-from-spawn-blocks: 900
    minimum-site-offset-blocks: 260
    maximum-site-offset-blocks: 420
    ambient-effects-enabled: true
    abandoned-only: true
    resident-echoes-enabled: false
    trains-enabled: false
  facilities:
    enabled: true
    maximum-safe-room-level: 3
    safe-room-base-radius-blocks: 24
    safe-room-upgrade-radius-blocks: 18
    generator-illumination-radius-blocks: 28
    generator-requires-insulated-wire: 2
    generator-requires-fuses: 2
    generator-requires-power-cells: 1
integrations:
  bettermodel:
    enabled: true
    required: true
    default-watcher-model: watcher
