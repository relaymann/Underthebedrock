world:
  name: under_the_bedrock
  enabled-on-startup: true
  auto-start: true
  auto-join-on-connect: true
  auto-respawn: true
  lock-to-experience: true
  floor-y: 64
  spawn-x: 0
  spawn-z: 0
  time: 18000
horror:
  null:
    minimum-distance-blocks: 1000
  enclosure:
    enabled: true
    radius-blocks: 1500
    wall-thickness-blocks: 16
    wall-height-blocks: 18
    apostle-model: utb_unperson
    apostle-sprint-speed: 0.25
    apostle-hunt-speed: 0.17
  director:
    enabled: true
    check-interval-seconds: 12
    minimum-occurrence-gap-seconds: 42
    severe-occurrence-cooldown-minutes: 8
    base-roll-chance: 0.22
  events:
    enabled: true
    minimum-cooldown-seconds: 150
    maximum-cooldown-seconds: 360
    region-cell-size-blocks: 128
    first-event-delay-seconds: 150
  clues:
    enabled: true
    scan-interval-ticks: 100
    site-cell-size-blocks: 1024
    minimum-distance-blocks: 768
    evidence-file: player-horror-memory.yml
  structures:
    enabled: true
    scan-interval-ticks: 100
    site-cell-size-blocks: 1024
    cell-generation-chance: 0.32
    regeneration-hours: 1
    spawn-check-radius-blocks: 96
    ancient-factions-enabled: true
    memory-shard-chance: 1.0
    rare-artifact-chance: 0.04
  supply-drops:
    enabled: true
    interval-minutes: 30
    retry-seconds: 60
    minimum-radius-blocks: 16
    maximum-radius-blocks: 40
  items:
    enabled: true
    cooldowns:
      emergency_rations: 45
      field_medkit: 45
      stabilizer_injection: 45
      sedative: 45
      speed_boost: 35
      emergency_barrier: 90
      null_ward: 90
      last_resort_device: 90
  entities:
    enabled: true
    safe-radius-blocks: 512
    full-threat-distance-blocks: 4096
    maximum-chance-per-check: 0.10
    successful-encounter-cooldown-minutes: 5
    active-encounters-per-player: 1
    max-encounter-duration-seconds: 180
    behavior:
      observation-range-blocks: 100
      despawn-range-blocks: 128
      passive-vanish-range-blocks: 60
      movement-speed-blocks-per-tick: 0.085
      remember-last-known-position: true
      player-specific-visibility: true
      adaptive-selection: true
      crawler-maximum-light-level: 7
    models:
      observer: utb_observer
      stalker: utb_stalker
      wanderer: utb_wanderer
      mimic: utb_mimic
      mimic-revealed: utb_mimic_revealed
      aggressor: utb_aggressor
      deep_entity: utb_deep_entity
      witness: utb_witness
      peeker: utb_peeker
      forgotten_resident: utb_forgotten_resident
      surveyor: utb_surveyor
      lurker: utb_lurker
      doorframe: utb_doorframe
      ceiling_crawler: utb_ceiling_crawler
      echo: utb_echo
      pursuer: utb_pursuer
      crawling_one: utb_crawling_one
      heavy: utb_heavy
      imitator: utb_imitator
      misprint: utb_misprint
      double: utb_double
      absence: utb_absence
      excavator: utb_excavator
      unperson: utb_unperson
      original: utb_original
      watcher: utb_watcher
      drifter: utb_drifter
      crawler: utb_crawler
  memory:
    file: player-horror-memory.yml
  civilization:
    enabled: true
    scan-interval-ticks: 100
    cell-generation-chance: 0.20
    ambient-effects-enabled: true
    resident-echoes-enabled: true
integrations:
  bettermodel:
    enabled: true
    required: true
    default-watcher-model: utb_watcher
