world:
  name: under_the_bedrock
  enabled-on-startup: false
  floor-y: 64
  spawn-x: 0
  spawn-z: 0
  time: 18000
player:
  return-location-file: player-locations.yml
horror:
  director:
    enabled: true
    check-interval-seconds: 12
    minimum-occurrence-gap-seconds: 42
    severe-occurrence-cooldown-minutes: 8
    base-roll-chance: 0.22
  clues:
    enabled: true
    scan-interval-ticks: 100
    site-cell-size-blocks: 1024
    minimum-distance-blocks: 768
    evidence-file: player-horror-memory.yml
  structures:
    enabled: true
    scan-interval-ticks: 100
    site-cell-size-blocks: 1024
    cell-generation-chance: 0.32
    regeneration-hours: 1
  entities:
    enabled: true
    safe-radius-blocks: 512
    full-threat-distance-blocks: 8192
    maximum-chance-per-check: 0.025
    successful-encounter-cooldown-minutes: 8
    active-encounters-per-player: 1
    models:
      observer: watcher
      stalker: watcher
      wanderer: watcher
      mimic: watcher
      aggressor: watcher
      deep_entity: watcher
  memory:
    file: player-horror-memory.yml
integrations:
  nova:
    enabled: true
    required: true
  bettermodel:
    enabled: true
    required: true
    default-watcher-model: watcher
