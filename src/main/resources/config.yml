world:
  name: under_the_bedrock
  enabled-on-startup: true
  auto-start: true
  auto-join-on-connect: true
  auto-respawn: true
  lock-to-experience: true
  admin-stop-evacuation: true
  floor-y: 64
  spawn-x: 0
  spawn-z: 0
  time: 18000
  position-save-interval-ticks: 100
horror:
  null:
    minimum-distance-blocks: 1000
  director:
    enabled: true
    check-interval-seconds: 4
    minimum-occurrence-gap-seconds: 10
    severe-occurrence-cooldown-minutes: 1
    base-roll-chance: 0.62
  events:
    enabled: true
    minimum-cooldown-seconds: 75
    maximum-cooldown-seconds: 150
    event-variation-memory: true
  exploration-pacing-v2: true
  exploration-pacing-v3: true
  clues:
    enabled: true
    scan-interval-ticks: 40
    site-cell-size-blocks: 512
    minimum-distance-blocks: 768
    evidence-file: player-horror-memory.yml
  structures:
    enabled: true
    scan-interval-ticks: 40
    site-cell-size-blocks: 512
    cell-generation-chance: 0.82
    regeneration-hours: 1
    spawn-check-radius-blocks: 160
    ancient-factions-enabled: true
    memory-shard-chance: 1.0
    rare-artifact-chance: 0.04
  supply-drops:
    enabled: true
    interval-minutes: 30
    retry-seconds: 60
    minimum-radius-blocks: 16
    maximum-radius-blocks: 40
  items:
    enabled: true
    cooldowns:
      emergency_rations: 45
      field_medkit: 45
      stabilizer_injection: 45
      sedative: 45
      speed_boost: 35
      emergency_barrier: 90
      null_ward: 90
      last_resort_device: 90
  entities:
    enabled: true
    safe-radius-blocks: 256
    full-threat-distance-blocks: 3072
    maximum-chance-per-check: 0.18
    successful-encounter-cooldown-minutes: 1
    active-encounters-per-player: 1
    max-encounter-duration-seconds: 180
    behavior:
      observation-range-blocks: 128
      despawn-range-blocks: 176
      passive-vanish-range-blocks: 60
      movement-tick-interval: 2
      encounter-check-interval-ticks: 20
      minimum-spawn-distance-blocks: 48
      maximum-spawn-distance-blocks: 96
      movement-step-blocks: 0.16
      remember-last-known-position: true
      player-specific-visibility: true
      adaptive-selection: true
    models:
      observer: watcher
      stalker: watcher
      wanderer: watcher
      mimic: watcher
      aggressor: watcher
      deep_entity: watcher
      witness: watcher
      peeker: watcher
      forgotten_resident: watcher
      surveyor: watcher
      lurker: watcher
      doorframe: watcher
      ceiling_crawler: watcher
      echo: watcher
      pursuer: watcher
      crawling_one: watcher
      heavy: watcher
      imitator: watcher
      misprint: watcher
      double: watcher
      absence: watcher
      excavator: watcher
      unperson: watcher
      original: watcher
  memory:
    file: player-horror-memory.yml
  civilization:
    enabled: true
    scan-interval-ticks: 40
    cell-generation-chance: 0.58
    ambient-effects-enabled: true
    resident-echoes-enabled: true
  facilities:
    enabled: true
    maximum-safe-room-level: 3
    safe-room-base-radius-blocks: 24
    safe-room-upgrade-radius-blocks: 18
    generator-illumination-radius-blocks: 28
    generator-requires-insulated-wire: 2
    generator-requires-fuses: 2
    generator-requires-power-cells: 1
integrations:
  bettermodel:
    enabled: true
    required: true
    default-watcher-model: watcher
