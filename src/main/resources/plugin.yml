name: UnderTheBedrock
version: '0.1.0-SNAPSHOT'
main: dev.underthebedrock.UnderTheBedrockPlugin
api-version: '26.1'
description: Subtle psychological and analog ARG horror in a persistent void world.
authors: [relaymann]
depend: [BetterModel]
commands:
  enter:
    description: Enter Under The Bedrock.
    usage: /enter
  evidence:
    description: Review evidence you have personally discovered.
    usage: /evidence
  team:
    description: Create and manage player teams.
    usage: /team <create|invite|accept|leave|kick>
  base:
    description: Manage your player base and teammate permissions.
    usage: /base [info|power|fuel|map|upgrade [forge|farmanator|food-printer|security]|abandon|permissions]
  underthebedrock:
    description: Manage the horror world.
    usage: /underthebedrock <start|stop|status|reset [confirm]>
    permission: underthebedrock.admin
permissions:
  underthebedrock.admin:
    description: Manage the horror world.
    default: op
