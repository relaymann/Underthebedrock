name: UnderTheBedrock
version: '0.1.0-SNAPSHOT'
main: dev.underthebedrock.UnderTheBedrockPlugin
api-version: '26.1'
description: Subtle psychological and analog ARG horror in a persistent void world.
authors: [relaymann]
depend: [Nova, BetterModel]
commands:
  enter:
    description: Enter Under The Bedrock.
    usage: /enter
  evidence:
    description: Review evidence you have personally discovered.
    usage: /evidence
  underthebedrock:
    description: Manage the horror world.
    usage: /underthebedrock <start|stop|status>
    permission: underthebedrock.admin
permissions:
  underthebedrock.admin:
    description: Manage the horror world.
    default: op
