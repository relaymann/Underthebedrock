name: Build
on:
  push:
    branches:
      - main
      - feature/first-half-bettermodel-models
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Audit and build plugin
        run: gradle clean test build

      - name: Prepare direct-download JAR
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'UnderTheBedrock-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [[ -z "$jar_file" ]]; then
            echo "No plugin JAR was produced in build/libs"
            exit 1
          fi
          cp "$jar_file" build/UnderTheBedrock.jar
          test -s build/UnderTheBedrock.jar

      - name: Upload installable JAR artifact
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: under-the-bedrock-plugin
          path: build/UnderTheBedrock.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable JAR download
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Under The Bedrock build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/UnderTheBedrock.jar
